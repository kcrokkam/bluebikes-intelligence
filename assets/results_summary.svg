<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Bluebikes Intelligence results at a glance</title>
  <desc id="desc">Four summary metrics: 13.26 million station-hour rows, 92 unseen test days, 67.4 and 67.2 percent WAPE for departures and arrivals, and 40.4 percent Top-10 watchlist hit rate from the offline lag-feature research model versus 1.7 percent random expectation; production-model ranking accuracy is not reported.</desc>
  <rect width="1100" height="360" rx="24" fill="#ffffff"/>
  <text x="55" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">Results at a glance</text>
  <text x="55" y="86" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Next-day station demand forecasting and operational prioritization</text>

  <g transform="translate(55,120)">
    <rect width="230" height="165" rx="18" fill="#f3f4f6"/>
    <text x="22" y="45" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">13.26M</text>
    <text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#374151">station-hour rows</text>
    <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">Sep 2023 – Aug 2026</text>
    <text x="22" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">640 historical stations</text>
  </g>

  <g transform="translate(310,120)">
    <rect width="230" height="165" rx="18" fill="#f3f4f6"/>
    <text x="22" y="45" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">92</text>
    <text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#374151">unseen test days</text>
    <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">chronological evaluation</text>
    <text x="22" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">Jun – Aug 2026</text>
  </g>

  <g transform="translate(565,120)">
    <rect width="230" height="165" rx="18" fill="#f3f4f6"/>
    <text x="22" y="45" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#111827">67.4% / 67.2%</text>
    <text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#374151">test WAPE</text>
    <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">departures / arrivals</text>
    <text x="22" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">production-feasible model</text>
  </g>

  <g transform="translate(820,120)">
    <rect width="230" height="165" rx="18" fill="#f3f4f6"/>
    <text x="22" y="45" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">40.4%</text>
    <text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#374151">Top-10 hit rate</text>
    <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">offline research model</text>
    <text x="22" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">with lagged demand features</text>
  </g>

  <line x1="55" y1="320" x2="1045" y2="320" stroke="#e5e7eb"/>
  <text x="55" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Bluebikes Intelligence · chronological out-of-time evaluation</text>
</svg>